<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUAPA Native Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div id="pattern-strip"></div>
    </header>

    <main>
        <div id="selectors">
            <select id="source-language">
                <option value="en">English</option>
                <option value="pt">Português</option>
            </select>

            <button id="swap">⇄</button>

            <select id="target-language">
                <option value="tp">Tupi Potiguara</option>
                <option value="yt">Yaathe</option>
            </select>
        </div>

        <div id="text-boxes">
            <textarea id="source-text"></textarea>
            <textarea id="target-text" readonly></textarea>
        </div>
    </main>

    <footer>
        <div id="logo">
            <img src="assets/logo.png" alt="KUAPA logo">
            <p>Native Translator</p>
        </div>

        <p>
            © 2026 KUAPA Native Translator.
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
